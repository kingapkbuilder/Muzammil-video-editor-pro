name: Build Android APK (Capacitor)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MuzammilVideoEditor-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
